<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Repository — CmdRunner</title>
  <link rel="stylesheet" href="repository.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header__logo">
        <img src="../assets/icon-48.png" alt="CmdRunner" class="header__icon" />
        <h1 class="header__title">Test Repository</h1>
      </div>
      <button id="close-btn" class="header__close-btn" title="Close">✕</button>
    </header>

    <!-- View Tabs -->
    <div class="view-tabs">
      <button class="view-tab view-tab--active" data-view="capabilities">Capabilities</button>
      <button class="view-tab" data-view="elements">Elements</button>
      <button class="view-tab" data-view="classic">Classic Tree</button>
    </div>

    <!-- Search Bar -->
    <div class="search-bar">
      <input type="text" id="search-input" class="search-input" placeholder="Search by capability, project, test case…" />
      <button id="new-project-btn" class="btn btn--primary">+ New Project</button>
    </div>

    <!-- ════════ CAPABILITIES VIEW ════════ -->
    <main class="main" id="capabilities-view">
      <div class="cap-list" id="capability-list">
        <p class="cap-list__empty" id="cap-empty">No capabilities yet. Record a feature to build understanding.</p>
      </div>

      <!-- Capability Detail Panel -->
      <div class="detail-panel" id="detail-panel" hidden>
        <div class="detail-panel__header">
          <h2 class="detail-panel__title" id="detail-title"></h2>
          <button id="detail-close-btn" class="detail-panel__close">✕</button>
        </div>
        <div class="detail-panel__body" id="detail-body"></div>
      </div>
    </main>

    <!-- ════════ CLASSIC TREE VIEW ════════ -->
    <main class="main" id="classic-view" hidden>
      <div class="tree" id="repository-tree">
        <p class="tree__empty" id="tree-empty">No projects yet. Click "+ New Project" to get started.</p>
      </div>

      <!-- Detail Panel (shows test case steps when selected) -->
      <div class="detail-panel" id="classic-detail-panel" hidden>
        <div class="detail-panel__header">
          <h2 class="detail-panel__title" id="classic-detail-title"></h2>
          <button id="classic-detail-close-btn" class="detail-panel__close">✕</button>
        </div>
        <div class="detail-panel__meta" id="classic-detail-meta"></div>
        <div class="detail-panel__steps" id="classic-detail-steps"></div>
      </div>
    </main>

    <!-- ════════ ELEMENTS VIEW (Phase 11.5) ════════ -->
    <main class="main" id="elements-view" hidden>
      <div class="cap-list" id="element-list">
        <p class="cap-list__empty" id="element-empty">No elements yet. Record a feature to discover elements.</p>
      </div>

      <!-- Element Detail Panel (heal history) -->
      <div class="detail-panel" id="element-detail-panel" hidden>
        <div class="detail-panel__header">
          <h2 class="detail-panel__title" id="element-detail-title"></h2>
          <button id="element-detail-close-btn" class="detail-panel__close">✕</button>
        </div>
        <div class="detail-panel__body" id="element-detail-body"></div>
      </div>
    </main>
  </div>
  <script type="module" src="repository-page.ts"></script>
</body>
</html>
