<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><title>Formless Enter no-op</title>
<style>body{font:15px/1.5 system-ui;max-width:560px;margin:3rem auto;padding:0 1rem}.wrap{margin-top:1.5rem;display:flex;gap:.5rem}input{flex:1;padding:.5rem .75rem}</style>
</head>
<body>
  <h1>Formless Enter no-op</h1>
  <p>No &lt;form&gt;, no Enter handler, no fetch, no navigation. Enter must produce NO commit — the TextEntry stays honestly interrupted at STOP.</p>
  <div class="wrap">
    <input id="q" placeholder="Search products" aria-label="Search products" data-auto-id="search-input" />
  </div>
  <script>
    // Deliberately NO keydown handler: Enter does nothing.
    window.__marker = 'noop';
  </script>
</body>
</html>
