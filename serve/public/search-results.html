<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><title>Search results</title>
<style>body{font:15px/1.5 system-ui;max-width:560px;margin:3rem auto;padding:0 1rem}.card{border:1px solid #ddd;border-radius:8px;padding:.75rem;margin:.5rem 0}</style>
</head>
<body>
  <h1>Search results</h1>
  <div id="results"></div>
  <script>
    const q = new URLSearchParams(location.search).get('q') || '';
    document.getElementById('results').innerHTML =
      Array.from({length: 8}, (_, i) =>
        `<div class="card">Result ${i+1} for “${q}”</div>`).join('');
  </script>
</body>
</html>
