<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><title>Formless search (SPA)</title>
<style>body{font:15px/1.5 system-ui;max-width:560px;margin:3rem auto;padding:0 1rem}.wrap{margin-top:1.5rem;display:flex;gap:.5rem}input{flex:1;padding:.5rem .75rem}button{padding:.5rem 1.25rem}#status{margin-top:.75rem;color:#256029}.results{margin-top:1rem}.results li{padding:.25rem 0}</style>
</head>
<body>
  <h1>Formless search (SPA)</h1>
  <p>No &lt;form&gt;. The app's own Enter handler fetches results and <code>pushState</code>s a search URL. Tier-N territory (navigation effect).</p>
  <div class="wrap">
    <input id="q" placeholder="Search products" aria-label="Search products" data-auto-id="search-input" />
    <button id="go" type="button" data-auto-id="search-submit">Search</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <ul class="results" id="results"></ul>
  <script>
    const input = document.getElementById('q');
    const results = document.getElementById('results');
    const status = document.getElementById('status');
    async function doSearch(q) {
      status.textContent = 'Searching…';
      // The API call the observation stack stamps to the last trusted action
      const res = await fetch('/search-results.html?q=' + encodeURIComponent(q));
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const items = Array.from(doc.querySelectorAll('.card')).map((el) => el.textContent.trim());
      results.replaceChildren(...items.map((t) => { const li = document.createElement('li'); li.textContent = t; return li; }));
      status.textContent = items.length + ' results';
      history.pushState({ q }, '', '/search-results.html?q=' + encodeURIComponent(q));
    }
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && input.value.trim() !== '') doSearch(input.value.trim());
    });
    document.getElementById('go').addEventListener('click', () => {
      if (input.value.trim() !== '') doSearch(input.value.trim());
    });
  </script>
</body>
</html>
